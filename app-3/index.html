<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Name Spinner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <a class="back-link" href="../">Back to apps</a>
      <section class="spinner-card" aria-labelledby="page-title">
        <p class="eyebrow">Random picker</p>
        <h1 id="page-title">Who goes next?</h1>
        <p class="intro">Give the wheel a click and let the names decide.</p>

        <div class="name-display" aria-live="polite" aria-atomic="true">
          <span id="nameDisplay">Ready?</span>
        </div>
        <p class="status" id="status" role="status">Loading names...</p>

        <button class="spin-button" id="spinButton" type="button" disabled>
          <span class="button-icon" aria-hidden="true">&#8635;</span>
          Spin the names
        </button>
        <p class="count" id="count" aria-live="polite"></p>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
