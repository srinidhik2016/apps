<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13294b" />
    <meta name="description" content="Recall remembers your work day and tells you about it whenever you ask." />
    <title>Recall | Your work memory assistant</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="chat-app">
      <header class="topbar">
        <a class="back-button" href="../" aria-label="Back to apps" title="Back to apps">‹</a>
        <div class="brand-mark" aria-hidden="true">🗂️</div>
        <div class="profile-copy">
          <h1>Recall</h1>
          <p>Your work memory assistant</p>
        </div>
        <button class="icon-button" id="clear-chat" type="button" aria-label="Clear chat" title="Clear chat">⌫</button>
      </header>

      <section class="chat-wall" id="chat-wall" aria-live="polite">
        <div class="date-chip">TODAY</div>
        <div class="message-row assistant-row">
          <div class="avatar small-avatar bot-avatar" aria-hidden="true">🗂️</div>
          <div class="bubble assistant-bubble">
            <p>Hello! I’m Recall. Tell me about your work day and I’ll remember it for you.</p>
            <p>Later, just ask me something you told me before.</p>
            <time>9:41 AM</time>
          </div>
        </div>
      </section>

      <form class="composer" id="chat-form">
        <label class="sr-only" for="message-input">Tell Recall something, or ask about a day</label>
        <input id="message-input" autocomplete="off" placeholder="Tell me something, or ask about a day..." required />
        <button class="send-button" type="submit" aria-label="Send message" title="Send message">➤</button>
      </form>
      <p class="privacy-note">Recall saves memories only on this device.</p>
    </main>
    <script src="./app.js?v=1"></script>
  </body>
</html>
