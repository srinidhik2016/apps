<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apps Landing Page</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fdf2f8, #eef2ff);
        color: #1f2937;
      }
      .card {
        background: white;
        padding: 2rem;
        border-radius: 16px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
        text-align: center;
        max-width: 540px;
      }
      .links {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 1.25rem;
      }
      a {
        text-decoration: none;
        background: #4f46e5;
        color: white;
        padding: 0.75rem 1rem;
        border-radius: 999px;
        font-weight: 600;
      }
      a:hover {
        background: #4338ca;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Welcome to the Apps workspace</h1>
      <p>Select an app below to open it.</p>
      <div class="links">
        <a href="./app-1/">Open App 1</a>
        <a href="./app-2/">Open App 2</a>
      </div>
    </main>
  </body>
</html>
